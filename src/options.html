<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Forum Helper 设置</title>
  <style>
    body {
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #333;
      margin: 0;
      padding: 24px;
      max-width: 520px;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .row label { flex: 1; }
    .row small { display: block; color: #888; }
    input[type="color"] {
      width: 64px;
      height: 32px;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    .actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
    button {
      font: inherit;
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f7f7f7;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    #status { color: #2a7d2a; font-size: 13px; }
  </style>
</head>
<body>
  <h1>预览面板外观</h1>

  <div class="row">
    <label for="headerBg">标题栏背景色<small>侧栏顶部标题栏</small></label>
    <input type="color" id="headerBg">
  </div>
  <div class="row">
    <label for="titleColor">标题文字颜色</label>
    <input type="color" id="titleColor">
  </div>
  <div class="row">
    <label for="borderColor">边框颜色<small>面板分隔线与标题栏下边框</small></label>
    <input type="color" id="borderColor">
  </div>

  <div class="actions">
    <button id="reset" type="button">恢复默认</button>
    <span id="status"></span>
  </div>

  <script src="content/core/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
