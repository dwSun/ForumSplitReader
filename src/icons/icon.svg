<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Chrome Web Store 规范：图形 96x96 居中，外围 16px/边透明留白；
       深色图形加 subtle 白色外 glow 保证暗色背景可读（用几何光晕层，不依赖滤镜）。
       https://developer.chrome.com/docs/webstore/images -->
  <rect x="19" y="19" width="90" height="90" rx="24" fill="#ffffff" opacity="0.16"/>
  <!-- 主体：深蓝圆角方块（96x96 @16,16） -->
  <rect x="16" y="16" width="96" height="96" rx="21" fill="#1a1a2e"/>
  <!-- 左：话题列表列 -->
  <rect x="30" y="36" width="22" height="56" rx="5" fill="#e8e8f0"/>
  <rect x="34.5" y="44" width="13" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.55"/>
  <rect x="34.5" y="53" width="13" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.35"/>
  <rect x="34.5" y="62" width="13" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.55"/>
  <rect x="34.5" y="71" width="13" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.35"/>
  <!-- 右：预览面板 -->
  <rect x="58" y="36" width="40" height="56" rx="5" fill="#ffffff"/>
  <rect x="63" y="45" width="28" height="5" rx="2.5" fill="#4f8cff"/>
  <rect x="63" y="56" width="28" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.3"/>
  <rect x="63" y="64" width="28" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.3"/>
  <rect x="63" y="72" width="20" height="3.5" rx="1.75" fill="#1a1a2e" opacity="0.3"/>
</svg>
